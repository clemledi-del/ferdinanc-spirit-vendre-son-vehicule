<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administration — Ferdinand Spirit</title>
  <style>
    :root{--bg:#f5f5f3;--panel:#fff;--text:#161616;--muted:#6b6b68;--line:#deded9;--black:#111}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border:1px solid var(--line);padding:28px}
    h1{font-size:24px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input{width:100%;height:46px;border:1px solid var(--line);padding:0 12px;font-size:16px;background:#fff}
    button{height:46px;border:0;background:var(--black);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
    .login button{width:100%;margin-top:12px}
    .error{color:#a51e1e;font-size:13px;margin-top:10px;min-height:18px}
    .admin{display:none;padding:28px}
    .top{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
    .top h1{margin:0}.meta{color:var(--muted);font-size:13px;margin-top:5px}
    .actions{display:flex;gap:10px;align-items:center}.actions input{width:280px}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;min-width:1450px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
    th{position:sticky;top:0;background:#f0f0ed;z-index:1;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    tbody tr:hover{background:#fafafa}
    .nowrap{white-space:nowrap}.empty{color:#aaa}.pill{display:inline-block;padding:4px 7px;background:#eee;border-radius:999px;white-space:nowrap}
    a{color:inherit}.crm{font-weight:700}
    @media(max-width:720px){.admin{padding:16px}.top{display:block}.actions{margin-top:14px}.actions input{width:100%}}
  </style>
</head>
<body>
  <section class="login" id="login">
    <div class="card">
      <h1>Ferdinand Spirit — Admin</h1>
      <p class="sub">Accès aux soumissions du formulaire d'estimation.</p>
      <form id="loginForm">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" autofocus>
        <button type="submit">Accéder</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </section>

  <main class="admin" id="admin">
    <div class="top">
      <div>
        <h1>Soumissions du formulaire</h1>
        <div class="meta" id="meta"></div>
      </div>
      <div class="actions">
        <input id="search" type="search" placeholder="Rechercher nom, modèle, email…">
        <button id="logout" type="button">Déconnexion</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Prénom</th><th>Nom</th><th>Email</th><th>Téléphone</th><th>CP</th>
          <th>Marque</th><th>Modèle</th><th>Version</th><th>Année</th><th>Km</th>
          <th>Statut</th><th>Tri</th><th>Commercial</th><th>CRM</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

    };

    let state = null;
    const $ = s => document.querySelector(s);
    const td = v => v === null || v === undefined || v === "" ? '<span class="empty">—</span>' : String(v);

    function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
    async function decrypt(password){
      const keyMaterial = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:b64(ENCRYPTED.salt),iterations:120000,hash:"SHA-256"},
        keyMaterial,{name:"AES-GCM",length:256},false,["decrypt"]
      );
      const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENCRYPTED.iv)}, key, b64(ENCRYPTED.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    function formatDate(v){
      if(!v) return "—";
      const d = new Date(v.replace(" ","T"));
      return isNaN(d) ? v : d.toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
    }
    function esc(v){
      return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    }
    function render(filter=""){
      const q = filter.trim().toLowerCase();
      const rows = state.leads.filter(x => !q || Object.values(x).join(" ").toLowerCase().includes(q));
      $("#rows").innerHTML = rows.map(x => `
        <tr>
          <td class="nowrap">${esc(formatDate(x.date_entree))}</td>
          <td>${td(esc(x.prenom))}</td><td>${td(esc(x.nom))}</td><td>${td(esc(x.email))}</td>
          <td class="nowrap">${td(esc(x.telephone))}</td><td>${td(esc(x.code_postal))}</td>
          <td>${td(esc(x.marque))}</td><td>${td(esc(x.modele))}</td><td>${td(esc(x.version))}</td>
          <td>${td(esc(x.annee))}</td><td>${x.kilometrage ? Number(x.kilometrage).toLocaleString("fr-FR") : '<span class="empty">—</span>'}</td>
          <td><span class="pill">${td(esc(x.statut))}</span></td><td>${td(esc(x.tri))}</td><td>${td(esc(x.commercial))}</td>
          <td><a class="crm" target="_blank" rel="noopener" href="${esc(x.url)}">Ouvrir</a></td>
        </tr>`).join("");
      $("#meta").textContent = rows.length + " soumission" + (rows.length>1?"s":"") + " · snapshot CRM du 27/11/2026";
    }

    $("#loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("#error").textContent = "";
      try{
        state = await decrypt($("#password").value);
        sessionStorage.setItem("fs_admin_pwd", $("#password").value);
        $("#login").style.display="none";
        $("#admin").style.display="block";
        render();
      }catch(err){
        $("#error").textContent = "Mot de passe incorrect.";
      }
    });
    $("#search").addEventListener("input",e=>render(e.target.value));
    $("#logout").addEventListener("click",()=>{sessionStorage.removeItem("fs_admin_pwd");location.reload();});

    (async()=>{
      const p=sessionStorage.getItem("fs_admin_pwd");
      if(!p)return;
      try{
        state=await decrypt(p);
        $("#login").style.display="none";$("#admin").style.display="block";render();
      }catch(e){sessionStorage.removeItem("fs_admin_pwd");}
    })();
  </script>
</body>
</html>
