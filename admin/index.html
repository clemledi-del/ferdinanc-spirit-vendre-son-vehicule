<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administration — Ferdinand Spirit</title>
  <style>
    :root{--bg:#f5f5f3;--panel:#fff;--text:#161616;--muted:#6b6b68;--line:#deded9;--black:#111}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .login{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border:1px solid var(--line);padding:28px}
    h1{font-size:24px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
    input{width:100%;height:46px;border:1px solid var(--line);padding:0 12px;font-size:16px;background:#fff}
    button{height:46px;border:0;background:var(--black);color:#fff;font-weight:700;padding:0 18px;cursor:pointer}
    .login button{width:100%;margin-top:12px}
    .error{color:#a51e1e;font-size:13px;margin-top:10px;min-height:18px}
    .admin{display:none;padding:28px}
    .top{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
    .top h1{margin:0}.meta{color:var(--muted);font-size:13px;margin-top:5px}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap} button:disabled{opacity:.5;cursor:wait}.actions input{width:280px}
    .table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;min-width:1450px}
    th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
    th{position:sticky;top:0;background:#f0f0ed;z-index:1;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
    tbody tr:hover{background:#fafafa}
    .nowrap{white-space:nowrap}.empty{color:#aaa}.pill{display:inline-block;padding:4px 7px;background:#eee;border-radius:999px;white-space:nowrap}
    a{color:inherit}.crm{font-weight:700}
    @media(max-width:720px){.admin{padding:16px}.top{display:block}.actions{margin-top:14px}.actions input{width:100%}}
  </style>
</head>
<body>
  <section class="login" id="login">
    <div class="card">
      <h1>Ferdinand Spirit — Admin</h1>
      <p class="sub">Accès aux soumissions du formulaire d'estimation.</p>
      <form id="loginForm">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" autocomplete="current-password" autofocus required>
        <button type="submit">Accéder</button>
        <div class="error" id="error" role="alert"></div>
      </form>
    </div>
  </section>

  <main class="admin" id="admin">
    <div class="top">
      <div>
        <h1>Soumissions du formulaire</h1>
        <div class="meta" id="meta" role="status"></div>
      </div>
      <div class="actions">
        <input id="search" type="search" placeholder="Rechercher nom, modèle, email…" aria-label="Rechercher une soumission">
        <button id="refresh" type="button">Actualiser</button>
        <button id="logout" type="button">Déconnexion</button>
      </div>
    </div>
    <p id="loadError" class="error" role="alert"></p>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Prénom</th><th>Nom</th><th>Email</th><th>Téléphone</th><th>CP</th>
          <th>Marque</th><th>Modèle</th><th>Version</th><th>Année</th><th>Km</th>
          <th>UTM source</th><th>UTM campaign</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script>
    "use strict";
    const CFG = window.FS_CONFIG || {};
    const $ = s => document.querySelector(s);
    let rows = [], password = "", updatedAt = null, loading = false, generation = 0;
    // Le mot de passe n'est conservé qu'en mémoire et n'est envoyé qu'à la RPC.
    const fields = ["created_at", "prenom", "nom", "email", "telephone", "code_postal",
      "marque", "modele", "version", "annee", "kilometrage", "utm_source", "utm_campaign"];

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      return isNaN(date.getTime()) ? String(value) : date.toLocaleString("fr-FR", {
        dateStyle: "short", timeStyle: "short", timeZone: "Europe/Paris"
      });
    }

    function render() {
      const query = $("#search").value.trim().toLocaleLowerCase("fr-FR");
      const filtered = rows.filter(row => !query || fields.some(key =>
        String(row[key] ?? "").toLocaleLowerCase("fr-FR").includes(query)));
      const fragment = document.createDocumentFragment();
      filtered.forEach(row => {
        const tr = document.createElement("tr");
        fields.forEach(key => {
          const cell = document.createElement("td");
          const value = row[key];
          cell.textContent = key === "created_at" ? formatDate(value)
            : key === "kilometrage" && value !== null && value !== undefined && value !== ""
              ? Number(value).toLocaleString("fr-FR")
              : String(value ?? "") || "—";
          tr.appendChild(cell);
        });
        fragment.appendChild(tr);
      });
      if (!filtered.length) {
        const tr = document.createElement("tr"), cell = document.createElement("td");
        cell.colSpan = fields.length;
        cell.textContent = query ? "Aucun résultat." : "Aucune soumission pour le moment.";
        tr.appendChild(cell); fragment.appendChild(tr);
      }
      $("#rows").replaceChildren(fragment);
      $("#meta").textContent = filtered.length + " / " + rows.length + " soumission(s) · Mise à jour : "
        + formatDate(updatedAt) + " · Actualisation automatique toutes les 15 s";
    }

    async function listSubmissions(candidate) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);
      try {
        const all = [];
        // Pagination pour ne pas limiter silencieusement le tableau aux 1 000 premières lignes.
        for (let offset = 0; ; ) {
          const response = await fetch(CFG.supabaseUrl.replace(/\/$/, "")
            + "/rest/v1/rpc/admin_list_submissions?limit=1000&offset=" + offset, {
            method: "POST",
            headers: { apikey: CFG.supabaseKey, "Content-Type": "application/json" },
            body: JSON.stringify({ p_password: candidate }),
            signal: controller.signal,
            cache: "no-store"
          });
          if (!response.ok) {
            if (response.status === 400 || response.status === 401 || response.status === 403) {
              throw new Error("Accès refusé. Vérifiez le mot de passe.");
            }
            throw new Error("Lecture Supabase impossible (HTTP " + response.status + ").");
          }
          const batch = await response.json();
          if (!Array.isArray(batch)) throw new Error("Réponse Supabase inattendue.");
          all.push(...batch);
          const range = response.headers.get("content-range");
          const total = range && range.split("/")[1];
          offset += batch.length;
          if (!batch.length || (total && total !== "*" && offset >= Number(total))) break;
        }
        return all;
      } finally { clearTimeout(timer); }
    }

    async function reload(candidate, login = false) {
      if (loading) return;
      loading = true;
      const token = generation;
      $("#refresh").disabled = true;
      $("#loginForm button").disabled = true;
      $("#error").textContent = "";
      $("#loadError").textContent = "";
      try {
        const result = await listSubmissions(candidate);
        if (token !== generation) return;
        rows = result; updatedAt = new Date();
        password = candidate;
        $("#password").value = "";
        $("#login").style.display = "none";
        $("#admin").style.display = "block";
        render();
      } catch (error) {
        if (token !== generation) return;
        $(login ? "#error" : "#loadError").textContent = error.name === "AbortError"
          ? "Le serveur met trop de temps à répondre. Réessayez."
          : error instanceof TypeError ? "Connexion impossible. Vérifiez votre connexion et réessayez."
          : error.message;
      } finally {
        loading = false;
        $("#refresh").disabled = false;
        $("#loginForm button").disabled = false;
      }
    }

    $("#loginForm").addEventListener("submit", event => {
      event.preventDefault();
      reload($("#password").value, true);
    });
    $("#search").addEventListener("input", render);
    $("#refresh").addEventListener("click", () => reload(password));
    $("#logout").addEventListener("click", () => {
      generation++;
      password = ""; rows = []; updatedAt = null;
      $("#rows").replaceChildren(); $("#search").value = "";
      $("#loadError").textContent = ""; $("#meta").textContent = "";
      $("#admin").style.display = "none"; $("#login").style.display = "grid";
      $("#password").value = ""; $("#password").focus();
    });
    setInterval(() => { if (password && !document.hidden) reload(password); }, 15000);
  </script>
</body>
</html>
